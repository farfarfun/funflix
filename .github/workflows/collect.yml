name: Data Pipeline

on:
  schedule:
    # 每 2 小时跑一次，错开整点避免和别的 workflow 抢跑。
    - cron: "13 */2 * * *"
  # 每次提交都跑一遍，代码改动引入的问题当天就能在真实数据上暴露，
  # 不用等到第二天定时任务才发现。
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # **`zh` extra 不是可选的，哪个节点漏了都会算出不一样的归一键。**
  # `normalize._to_simplified()` 在 opencc 缺失时原样返回，而 `norm_key` /
  # `series_norm_key` 都会调它 —— 装了 opencc 的环境把 `唐伯虎點秋香` 归一到
  # 「点」，没装的归一到「點」，于是同一部剧在两个环境下解析会建出两行 work。
  # 本地开发环境装了它，流水线早先只跑 `uv sync`（不带 extra）、没装，
  # 这正是「搜索结果重复」最难查的一种来源。
  #
  # `uv run` 自己也会按请求的 extra 同步环境，所以 `uv sync` 和每一条
  # `uv run` 必须带同一组 extra，否则后一条会把前一条装好的 opencc 卸掉。
  # 统一走这个变量，少一处写漏的机会。
  UV_SYNC_EXTRAS: --extra zh

jobs:
  # collect/parse/verify/canon/repair 各消费自己的队列（采集水位 / 待解析文档 /
  # 待校验资源 / 待裁决候选块 / 待修复 media），互不依赖对方产出的结果才能跑，
  # 所以拆成几个独立 job 并行执行，而不是一个 job 里顺序跑几步——一步卡住不该
  # 拖着后面几步一起等。
  #
  # 每个节点都只刷一小批（`--limit`），一轮刷不完下一轮接着刷：队列里的
  # pending 行本身就是断点。所以这套流水线不需要编排，也不需要「全量重建」
  # 那种一次性长跑 —— 213 万份待解析文档就是这么慢慢磨完的。
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-collect
      # **一轮都不许掐。** 这里原来是 `github.event_name == 'push'`，想的是
      # 「只让最新代码跑」—— 但这条流水线是在**补数据**，每一轮不管跑的是哪个
      # 版本的代码都在往前推进度，掐掉等于把已经跑掉的几十分钟直接扔了。实测
      # 2026-10-07 当天六七轮里有五轮是 `cancelled`，全是我自己 push 掐的，
      # 于是「这一轮到底跑通没跑通」反复看不出来。
      #
      # 改成 false 之后新一轮不会跟旧一轮并行：同组的新 run 变成 pending，
      # 等旧的跑完才开始（GitHub 在一个组里只留一个 pending，更新的到了会把
      # 前一个 pending 取消掉 —— 正好是想要的「不丢进度、也不堆积」）。
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync $UV_SYNC_EXTRAS

      # 数据库地址、采集源凭证等都不进仓库，运行前从远端密钥库拉到本地。
      # secret 里若混入尾随空白（复制粘贴常见），会被解析进库名导致连接失败，先 trim 掉。
      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          uv run $UV_SYNC_EXTRAS funsecret load "$url"

      - name: Collect
        run: uv run $UV_SYNC_EXTRAS funflix collect --limit 10000

  # 分 8 片并行。落库全程只有一个消费者线程，所以单进程调大 `--concurrency`
  # 不会提速 —— 瓶颈是每条文档那两次数据库往返，不是抽取的 CPU。要提吞吐只能
  # 多开进程，而多开进程必须分片，否则各进程的翻页游标从同一处起步、
  # 把同一批文档重复解析一遍。各片按 `id` 末位十六进制字符取模，互斥且均匀
  # （见 `services/extract/concurrent_runner.py::shard_condition`）。
  #
  # **为什么从 4 片提到 8 片**：这里原来写的是「片数越多越容易在热行上互相
  # 等锁」，依据是早先 8 片实测 2.6 条/s、比单进程的 4.6 条/s 还慢。那个结论
  # 现在**已经不成立**了 —— 它的成因是标签和资源的计数自增在热行上握锁握到
  # 外层事务提交，两处都改成了收尾时一条算术 UPDATE（见
  # `services/extract/runner.py` 的 `_apply_tag_count_deltas` /
  # `_apply_resource_seen_deltas`）。2026-10-08 在 4 片 + 本机一个进程同时写库
  # 的时候采了三次 `pg_stat_activity`：`pg_blocking_pids` **全是空的**，没有
  # 任何一个后端在等锁，而几乎每个后端都停在 `Client:ClientRead` ——
  # 数据库在等客户端发下一条语句，服务端是闲的。
  #
  # 也就是说瓶颈纯粹是往返延迟：40 条文档只发 60 次 SQL（1.5 次/条，批量已经
  # 没什么可省的），但每次往返 515ms。服务端既没在算也没在等锁，那加并发就是
  # 线性的，4 片 → 8 片应该直接把 178 万份的积压清理时间减半。
  #
  # 闸门是时间而不是条数（见下面 Parse 那一步），所以加片数不会让单片跑过
  # 120 分钟的 timeout。节点被 timeout 掐掉本身是安全的（分片不写库，掐掉
  # 只是让剩下的文档留在 pending），但每轮都红会把真实故障埋掉。
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # 一片挂了不影响其它片 —— 每片是独立的一批文档，没有共享产出。
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    concurrency:
      # 组名必须带上片号。不带的话四片会被 GitHub 当成同一组，
      # 互相排队（改 `cancel-in-progress: false` 之前是互相取消），
      # 四片退化成一片一片地跑。
      group: pipeline-parse-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync $UV_SYNC_EXTRAS

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          uv run $UV_SYNC_EXTRAS funsecret load "$url"

      # 单次运行处理量封顶，出问题（比如踩到某种脏数据死循环重试）
      # 影响范围有限，不会一次把所有待解析的都搭进去。
      #
      # 闸门用**时间**而不是条数。按条数填这个格子一直填不准：run
      # 37734962378 四个分片都跑满了 5000 条，耗时却是 50 / 68 / 68 / 68
      # 分钟 —— 同样的条数差 35%（文档难易不一样）。于是只能往保守那头填，
      # 6000 条按最慢的分片算约 82 分钟，剩下 38 分钟纯空转：cron 是每 2 小时
      # 一轮、job 预算也是 120 分钟，这等于三分之一的窗口白扔，而 pending 还
      # 有 183 万条。
      #
      # 6600 秒 = 110 分钟，留 10 分钟给 setup 和收尾。到点收工是安全的：
      # 落库按 `--write-batch` 逐批提交，已经解析完的不会回滚，没排到的下一轮
      # 接着领（见 `services/extract/concurrent_runner.py::_ParseProducer.produce`）。
      #
      # 这个 110 分钟**以前是假的**：流水线的两条队列不限长，生产者按 extract
      # 的速度把几十万条灌进内存，到点后它停了但程序要等队列排空才返回，于是
      # run 37757448206 的四片全被 `timeout-minutes: 120` 砍掉，一个优雅退出的
      # 都没有。队列限界之后收尾只要几十秒，这个数字才真正生效（见
      # `concurrent_runner.py::run_parse_pipeline` 的「两条队列都是限界的」）。
      - name: Parse
        run: >
          uv run $UV_SYNC_EXTRAS funflix parse
          --shard ${{ matrix.shard }}/8 --max-seconds 6600

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-verify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync $UV_SYNC_EXTRAS

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          uv run $UV_SYNC_EXTRAS funsecret load "$url"

      # 探测之前先把**已经知道答案**的链接填上。`link_check` 和 `resource`
      # 之间没有外键，`resource` 被重建完全不影响它，所以重解析出来的新
      # resource 虽然 `check_status` 是默认的 UNCHECKED，库里却存着它
      # （按 provider + share_id 认）历史上最后一次的校验结论。
      #
      # 没有 `--limit`，因为它本身就有界：一条流式查询读出每个链接的最新结论、
      # 按 5000 行一批 executemany，84 万个链接约 170 次往返。而且**只改
      # UNCHECKED 的行**，所以幂等、每轮跑都安全 —— 真实探测过的结论不会被
      # 历史覆盖回去。
      #
      # 这一步刻意排在 Verify 前面：填完之后 verify 的待办队列就只剩真正没有
      # 历史结论的链接，省掉几十万次无谓探测。
      - name: Relink
        run: uv run $UV_SYNC_EXTRAS funflix db relink-checks --yes

      # 用 `--max-seconds` 而不是靠 `--limit` 卡时长：吞吐由最慢那个网盘的
      # 限速决定（阿里云盘 1 次/秒），而待校验队列里阿里占了 77%，所以
      # 「一万条」要跑两个多小时 —— 之前每轮都撞 `timeout-minutes: 120`，
      # 整个 run 被判 cancelled，别的 job 全绿也看不出来。
      #
      # 4800 秒 = 80 分钟。先用 300 秒在 Action 上跑通闭环量过账：那一轮
      # Verify 这一步实际用了 5 分 07 秒 —— 只超预算 7 秒，收尾的尾巴很短
      # （输出队列限长的功劳，见 `concurrent_runner.py`），所以预算可以按
      # 线性放大。留的余量：Relink 实测 4 分 15 秒、历史最慢约 21 分钟，
      # 按 25 分钟算，25 + 80 + 收尾 ≈ 106 分钟，`timeout-minutes: 120`
      # 还剩十几分钟缓冲。
      #
      # 到点后生产端停止取新资源，已经探出来的结论照常落库，下一轮顺着
      # `last_checked_at` 游标接着往下走 —— 少量多次、持续推进。
      - name: Verify
        run: uv run $UV_SYNC_EXTRAS funflix verify --max-seconds 4800

  # 规则搞不定的归一残局交给 LLM：`刀锋战士 / 刀锋战士1 / 刀锋战士2 / 刀锋战士3`
  # 这种一个候选块里好几个候选项的，正则判不出它们是不是同一部作品的不同季。
  #
  # 两步刻意分开：`resolve` 只往 `title_canon` 写裁决、不动 media 一个字段，
  # `merge` 才落库。裁决是花钱买来的，落盘之后可以人工抽查再应用，而且
  # `title_canon` 是完整审计记录 —— 重跑 parse 或新数据入库都不会把已经并好的
  # 东西重新拆开。
  canon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-canon
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # 这个 job 多一个 `llm` extra（openai 客户端），其余节点用不到。
      - name: Install
        run: uv sync $UV_SYNC_EXTRAS --extra llm

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          uv run $UV_SYNC_EXTRAS --extra llm funsecret load "$url"

      # `--limit` 是**钱的闸门**，不只是时间的：一个块一次调用。已经 decided
      # 的键会被跳过，所以每轮都只打残局、不重复付费，一轮打不完下一轮接着打。
      #
      # `--concurrency` 压到 4（默认 8）：默认值会打出网关的
      # `429 Request Rate Reaches Maximum Limit`。
      #
      # **这一段是历史，现在的值是 16。** 下面「提额度的算术」那节讲了为什么能
      # 放开：真正的闸门是 `--call-interval`（速率），并发只决定排不排得满。
      #
      # 但限并发治不了根 —— 网关限的是**速率**。压到 4 之后实测仍有四分之一的
      # 调用吃 429（run 37693106252：200 次调用 10 分钟跑完 ≈ 20 次/分，失败 50
      # 次）。429 的请求网关不处理也不计费，但这一页的候选项被整页丢掉、留到
      # 下一轮重来，等于四分之一的进度白走。所以真正的闸门是
      # `--call-interval`：把调用起跑时刻排开到实际跑得通的速率上。
      #
      # 墙上时间也不是瓶颈，而且是**可以算准**的：`_Pacer` 保证两次调用起跑至少
      # 隔 `--call-interval`，所以 N 个块的耗时就是 `4N` 秒上下，跟并发无关。
      # 200 块实测 18 分钟（run 37744553498），`500 × 4s ≈ 33 分钟`，加上 merge
      # 那步实测的 17 分钟，离 120 分钟的预算还有一半。所以这一步不需要像 parse
      # 那样换成时间预算 —— 条数本身就是时间。
      #
      # 从 200 提到 500 的依据：那一轮报告「够格送裁决 1556 / 本次送出 200」，
      # 剩 1356 个块。按 200 一轮要 7 轮（cron 每 2 小时 → 14 小时），500 一轮
      # 3 轮就清完。代价是 token：200 块烧了 32 万输入 / 3.2 万输出。
      #
      # **500 已经是上限，不要再提。** run 37757448206 报「候选块总数 184053 /
      # 够格送裁决 1547 / 本次送出 409」，33 分 23 秒（409 × 4s = 27 分钟加上
      # 调用延迟，对得上），65.9 万输入 / 6.4 万输出 token。送出 409 < 500 说明
      # 额度没用满 —— 归一裁决这条线下一轮就见底了。
      #
      # 「候选块总数 184053」这个数字很容易让人误判工作量（我就误判过 30 倍）：
      # `resolver.py` 在 `len(entries) < 2` 就 continue 了，18 万块里 99.2% 是
      # 单 key 块，根本不送 LLM —— 一个 key 单独成块时没有任何候选可以跟它比，
      # 归一裁决对它无意义。真正的待办量看「够格送裁决」。
      #
      # 代价是这 18 万单 key 块的 `media_type` 永远得不到 LLM 补全：全库
      # `unknown` 的 64668 个键里 64519 个（99.8%）落在单 key 块里。**这正是
      # `--classify-limit` 存在的理由** —— 不是把上面那个 limit 提上去能解决的。
      #
      # ## --classify-limit：单 key 块只标类型
      #
      # 额度单位是**包**，一包 50 个键 = 一次调用。和 `--limit` 共用一个
      # `_Pacer`，两个额度都在花同一份时间预算，再加上约 6 分钟的全表扫描。
      # （总耗时**不是** `(归一块数 + 包数) × 4s`：分类的单次调用比 4 秒的节流
      # 间隔长得多，卡的是并发数，见下面第一轮的实测。）
      #
      # 本地实跑 2 包（100 个键）的实测，是定下面这个数字的依据：
      # 写入类型 62 / 判为垃圾 5 / 模型判不出 38 / 校验不通过 0 / 漏答 0。
      # 人眼过了那 62 条：`兄台请留步`、`三嫁惹君心` 判 tv，`尚硅谷大数据大神班`
      # 判 other，`意林pdf` 判 book，都对；5 条 junk 全是 confidence 1.0 的抓取
      # 残渣（`post via api service`、`asmr description`），只牵连 5 行 media。
      # movie/tv/anime 之间混了约 5-9%（`攻壳机动队` 判成 movie），但类型判错
      # 可以重判，和误并那种不可逆的损坏不是一回事 —— 而这条路**结构性地**
      # 不可能误并，它的 schema 里没有 `work_title`。
      #
      # 待办量 64582 个键 = 1292 包。先给 200 包（1 万个键）跑一轮看 Action 里的
      # 实测，确认绿了再往上提。
      #
      # 第一轮（run 37769919480）**没绿**，但两件事都量到了：
      #
      # 一、Resolve 跑了 57 分 22 秒，不是预估的 14 分钟。上面那个
      # `包数 × 4s` 的算法错了 —— 一包 50 个键的调用实测要 64 秒，远超 4 秒的
      # 节流间隔，所以瓶颈根本不是速率而是**并发数**：`--concurrency 4` 下实际
      # 请求速率只有 4/64 ≈ 3.75 次/分，而 4 秒节流允许 15 次/分，等于白留了
      # 四分之三的额度。所以这一轮把并发从 4 提到 8（7.5 次/分，仍在限流线下，
      # `_Pacer` 的 4 秒下限一个字没动）。
      #
      # 二、它是被一个并发写入冲突掀掉的：`Key (norm_key)=(佳偶天成王鹤润)
      # already exists` —— 同时在跑的 parse 在给没见过的键造 `pending` 行，撞上
      # 了落库那步「先查后写」的窗口。阶段 1 一轮才碰几十个键，这个竞态一直没
      # 撞上；阶段 2 一轮送一万个键就成了必然。而且一次冲突回滚掉整轮，一小时
      # 的调用全白烧。落库已经改成分段提交 + 撞了重查重跑（见
      # `services/canon/resolver.py::_persist`），所以这一轮的额度**仍然留在
      # 200 包**：上一轮没拿到「正常跑完」的结果，不能跳过这一步往上提。
      #
      # 第二轮（run 37778092602）**绿了**，200 包的实测：调用 200 次 0 失败
      # （并发 8 没吃到 429），写入类型 8247 条（82.5%），junk 1095 条且
      # `confidence < 0.9` 的一条都没有。抽查 60 个 junk 全是课程 / 软件 /
      # 壁纸 / 频道套话 / 电子书打包，没有误判成垃圾的影视作品。闭环拿到了，
      # 这一轮才开始提额度。
      #
      # ## 提额度的算术：卡的还是并发，不是速率
      #
      # 绿那轮 Resolve 70 分 35 秒跑完 331 次调用（阶段 1 的 131 + 阶段 2 的
      # 200），扣掉约 10 分钟的全表扫描，实测 **5.5 次/分**。而 4 秒的节流下限
      # 允许 15 次/分 —— 还是有三分之二的额度白留着，因为一次调用要一分多钟，
      # `--concurrency 8` 下根本排不满。所以这一轮：
      #
      # - **并发 8 → 16**。16/64 秒 = 15 次/分，正好把 `_Pacer` 的 4 秒下限
      #   排满，再往上加并发就没用了（下限会开始真正起作用）。`_Pacer` 一个字
      #   没动 —— 速率上限还是那条实测跑得通的线。
      # - **额度 200 → 300 包**（1.5 万个键）。按最坏情况定的：假设并发提上去
      #   完全不奏效、还是 5.5 次/分，那是 (131+300)/5.5 ≈ 78 分 + 扫描 10 分
      #   + Merge 22 分 = 110 分钟，仍在 120 以内。取 400 包的话最坏要 129
      #   分钟，会把 Merge 整步挤掉（它是 `if: !cancelled()`，job 超时是连它
      #   一起砍的），所以不取。
      #
      # 阶段 2 还改成了**边调边落**（见 `resolve_canon` 里那段注释）：以前是
      # 200 次调用全做完才一次性落库，到点被 SIGKILL 就是一小时的调用全烧掉；
      # 现在每攒够一段就提交，最坏只丢最后不到 `PERSIST_CHUNK_SIZE` 条。这是
      # 提额度的前提 —— 额度越大，攒着不落库的敞口越大。
      - name: Resolve
        run: >
          uv run $UV_SYNC_EXTRAS --extra llm funflix canon resolve
          --apply --yes --limit 500 --classify-limit 300
          --concurrency 16 --call-interval 4

      # 应用的是**之前每一轮**攒下来的裁决，不只是这一轮的，所以 resolve 挂了
      # （比如 LLM 网关抽风）它照样要跑完 —— job 整体仍然是红的，不会掩盖问题。
      #
      # `--limit` 是时间的闸门。这一步每个键一次 `assign_identities` + 一次
      # commit，裁决表单调涨：run 37726067206 攒到 5417 条时整步约两小时，连着
      # resolve 一起把 120 分钟的 job 预算吃光，被 `cancelled`，resolve 刚裁出来
      # 的 492 条一条都没落库。额度只花在「真有活要干」的键上（已就位的整键跳
      # 过，见 `services/canon/apply.py::_already_settled`）。
      #
      # 800 跑出来的实测（run 37744553498）：整步 17 分钟，报告「已裁决 5872 /
      # 已就位跳过 3465 / **本轮没排上 0**」—— 额度没用满，两小时那个病根确实
      # 就在那 3465 条重复重扫上。所以这个数不跟着 resolve 的 500 一起涨：
      # 没排上还是 0 就说明有余量，等它哪轮不是 0 了再提。
      #
      # 下一轮（run 37757448206）是 31 分 22 秒、「已裁决 6791 / 已就位跳过 3977
      # / 本轮没排上 0 / 合并删除 media 221」。耗时从 17 涨到 31 分钟，涨的是
      # 「已裁决」那个基数（5872 → 6791），不是额度不够。所以 800 继续不动 ——
      # 真要动的是「已就位跳过」那 3977 条为什么每轮都还要再扫一遍。
      #
      # 「从这 56 分钟余量里出」那句已经兑现了，而且**余量基本用光**：加了
      # `--classify-limit 200` 之后 run 37778092602 是 Resolve 70 分 + Merge
      # 22 分 ≈ 93 分钟。所以这一步的 800 更不能动了 —— 现在它涨一分钟就是
      # 从 classify 的额度里扣一分钟。真要腾地方，先治「已就位跳过」那 3977
      # 条每轮重扫。
      - name: Merge
        if: ${{ !cancelled() }}
        run: uv run $UV_SYNC_EXTRAS --extra llm funflix canon merge --apply --yes --limit 800

  # 解析规则永远加不完，每加一条就留下一批「按旧规则算出来、现在看是错的」
  # media。这个 job 就是把那批数据慢慢刷对，所以它和上面几个完全并列、
  # 不设 needs：它消费的是自己的 repair_task 队列。
  #
  # 和 parse 重叠的后果是自愈的——parse 若重新插回一行 repair 刚删的垃圾
  # media，下一轮 scan 会再把它检出来。为此把两个 job 串进同一个队列
  # （互相堵、push 时排队）代价大于收益。
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-repair
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync $UV_SYNC_EXTRAS

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          uv run $UV_SYNC_EXTRAS funsecret load "$url"

      # 只读 media + 只写 repair_task。规则没变时零写入，所以每轮都跑没有成本。
      #
      # **这一步不能加 `--limit`。** 它有这个选项，但翻页游标不跨进程持久化、
      # 每次都从 `media.id` 最小的那头重新开始，加了 limit 就等于永远只扫前
      # N 行、后面的数据再也修不到。全表扫是按主键翻页的有界查询，两小时一轮
      # 扛得住。要分轮磨得先给它一个存游标的地方。
      #
      # 这一步能无人值守的前提是 `clean_title` **幂等** —— 它拿库里存着的
      # （已经洗过的）`media.title` 重算一遍判漂移，不幂等的话每轮都会检出
      # 同一批行、改掉一点，而 `media.original_title` 全库为空、改掉找不回来。
      # 见 `tests/test_normalize.py::TestCleanTitleIdempotent`。
      - name: Scan
        run: uv run $UV_SYNC_EXTRAS funflix repair scan --apply

      # 破坏性的一半。**刻意不传 --force**：爆炸半径闸门（删除 > 全库 5% 或
      # 重挂 > 20% 就拒绝）在无人值守的自动流水线上是最后一道防线，一次规则
      # 写错不该被自动放行。真超限了这一步会红，人去核对 scan 的样例再决定。
      #
      # limit 从 5000 提到 10000，因为检出量已经超过了处理量：Scan 这三轮分别
      # 检出 419 / 3682 / 10016 行改标题，而 run 37757448206 的 Apply 领满 5000
      # 就封顶了 —— 再不提就开始积压。检出量涨是正常的，不是漏改又检出
      # （「失败 0 / 跳过 0」），是 parse 在不停建新 media、canon 的裁决也在
      # 不停让已有行的类型和年份漂移（`title_drift` 是标题/类型/年份的三路或）。
      #
      # 10000 这个数来自实测速率：5000 行用了 23 分钟（0.28 秒/行），10000 行
      # 约 46 分钟。同一个 job 的 Scan 18 分钟 + Prune 1.5 分钟，合计 66 分钟，
      # 离 120 分钟还有余量。没敢提更高是因为 Scan 自己也在变慢（12.7 → 18
      # 分钟，media 从 17 万涨到 19.4 万），那部分预算只会继续被吃掉。
      - name: Apply
        run: uv run $UV_SYNC_EXTRAS funflix repair apply --apply --yes --limit 10000

      # 深层修复：把规则版本过期的文档打回 parse 队列，由 parse job 按它自己
      # 的节奏消化。这一步和上面那步互不依赖，所以 apply 被闸门拦住时它照样
      # 要跑完（job 整体仍然是红的，不会掩盖问题）。
      - name: Requeue
        if: ${{ !cancelled() }}
        run: uv run $UV_SYNC_EXTRAS funflix repair requeue --apply --yes --limit 50000

      # 收 rehome / merge 的残留：media 搬走或被合并掉之后，原作品就空了，
      # 在这之前没人负责删它。搜索默认**不**过滤空壳（只有 `--valid-only`
      # 那条路才过滤），所以它们会直接出现在列表页里、点进去什么都没有 ——
      # 首次统计 36,223 行、占作品总数 17.9%。
      #
      # 放在 rehome 之后跑：上面那步刚制造出来的空壳，这步顺手就收掉了。
      #
      # 删行不可逆，所以先用 `--limit 2000` 跑了一轮对账：run 37744553498 报
      # 「删除空壳 2000 / 本轮没排上 33703」，合计 35,703，对得上本地量到的
      # 36,223（差的 520 个是这期间 parse 给它们挂上了 media，不再是空壳）。
      # 耗时 11.3 秒，含进程启动和连库，4 个批次。
      #
      # 按这个速率 20000 行约 2 分钟，repair 这个 job 的其余几步实测 Scan 13
      # 分钟 + Apply 20 分钟，离 120 分钟的预算还很远。没有一步提到 40000
      # 一轮清完：剩下的 13,703 行留到下一轮，中间多一次「前台点点看有没有
      # 误删」的机会 —— 删行这事只有这一次机会便宜。
      #
      # 20000 这一轮跑过了：run 37757448206 报「删除空壳 20000 / 本轮没排上
      # 11791」，84 秒。两数之和 31,791 对得上上一轮留下的 33,703（差的 1,912
      # 是这期间 parse 给它们挂上了 media）。剩的 11,791 下一轮一次清完，之后
      # 这一步的常态就是「没排上 0」，只收当轮 rehome / merge 新造的空壳。
      - name: Prune works
        if: ${{ !cancelled() }}
        run: uv run $UV_SYNC_EXTRAS funflix db prune-works --yes --limit 20000
