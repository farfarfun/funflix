name: Data Pipeline

on:
  schedule:
    # 每 2 小时跑一次，错开整点避免和别的 workflow 抢跑。
    - cron: "13 */2 * * *"
  # 每次提交都跑一遍，代码改动引入的问题当天就能在真实数据上暴露，
  # 不用等到第二天定时任务才发现。
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # collect/parse/verify 各消费自己的队列（采集水位 / 待解析文档 / 待校验资源），
  # 互不依赖对方产出的结果才能跑，所以拆成三个独立 job 并行执行，而不是
  # 一个 job 里顺序跑三步——一步卡住不该拖着后面两步一起等。
  collect:
    # 还没注册 self-hosted runner 之前，落回 GitHub 托管的 ubuntu-latest 也能正常跑——
    # 只是每次 job 都是全新机器，本地库每次从空的开始，等于每轮都做一次全量
    # pull + 全量 push（仍然比"逐条操作都跨境"快很多）。等 runner 机器就绪后，
    # 在仓库 Settings → Secrets and variables → Actions → Variables 里加一个
    # FUNFLIX_RUNNER_LABEL=self-hosted，不用再改这个文件。
    runs-on: ${{ vars.FUNFLIX_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    concurrency:
      group: pipeline-collect
      # push 触发时取消掉同组里还在跑的旧一轮（多半是上一次 push 触发的），
      # 只让最新代码跑；定时/手动触发不取消任何东西，保证数据采集轮次不丢。
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 数据库地址、采集源凭证等都不进仓库，运行前从远端密钥库拉到本地。
      # secret 里若混入尾随空白（复制粘贴常见），会被解析进库名导致连接失败，先 trim 掉。
      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          funsecret load "$url"

      # pipeline 全程改读写 runner 本机的 SQLite，不再每次读改写都跨境打远端 RDS。
      # 用 SQLite 而不是本机装 Postgres——单文件、零运维，runner 机器不需要额外装数据库。
      # 路径固定在 runner 账号的 HOME 下（不是 checkout 出来的工作区），
      # 这样每次 job 复用同一份文件，state 天然在同一台 runner 上的三个 job 之间延续；
      # 显式设置 FUNFLIX_DATABASE_URL 覆盖 funsecret 里的远端地址（env 优先级更高，
      # 见 base/config.py 里的说明），FUNFLIX_REMOTE_DATABASE_URL 不设，
      # 让 remote_database_url 落回 funsecret 拿到远端 RDS。
      - name: Configure local database
        run: |
          db_dir="$HOME/.cache/farfarfun/funflix"
          mkdir -p "$db_dir"
          echo "FUNFLIX_DATABASE_URL=sqlite+aiosqlite:///$db_dir/funflix.db" >> "$GITHUB_ENV"

      - name: Sync pull
        run: funflix sync pull

      # 每周一（北京时间）先把采集水位归零，核查是否有"水位漂移但没真正
      # 采到"的情况：重新翻旧内容会被 content_hash 唯一约束挡掉，不会
      # 重复入库，只有真正漏采的部分才会补进来。原始文本不受影响。
      # 只在定时触发时判断——push 触发的运行不需要跟着凑一次周一重置。
      - name: Reset cursors (Monday only)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Asia/Shanghai date +%u)" = "1" ]; then
            echo "今天是周一（北京时间），先重置采集水位"
            funflix source reset-cursor --yes
          else
            echo "非周一，跳过水位重置"
          fi

      - name: Collect
        run: funflix collect --limit 8000

      # 即使 collect 中途失败，已经落进本地库的这部分进度也要推回远端，
      # 不能让一次失败白白丢掉这一轮已经采到的数据。
      - name: Sync push
        if: always()
        run: funflix sync push

  parse:
    # 说明见 collect job：没配 FUNFLIX_RUNNER_LABEL 仓库变量时落回 ubuntu-latest。
    runs-on: ${{ vars.FUNFLIX_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    concurrency:
      group: pipeline-parse
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          funsecret load "$url"

      - name: Configure local database
        run: |
          db_dir="$HOME/.cache/farfarfun/funflix"
          mkdir -p "$db_dir"
          echo "FUNFLIX_DATABASE_URL=sqlite+aiosqlite:///$db_dir/funflix.db" >> "$GITHUB_ENV"

      - name: Sync pull
        run: funflix sync pull

      # 单次运行处理量封顶，出问题（比如踩到某种脏数据死循环重试）
      # 影响范围有限，不会一次把所有待解析的都搭进去。
      - name: Parse
        run: funflix parse --limit 30000

      - name: Sync push
        if: always()
        run: funflix sync push

  verify:
    # 说明见 collect job：没配 FUNFLIX_RUNNER_LABEL 仓库变量时落回 ubuntu-latest。
    runs-on: ${{ vars.FUNFLIX_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    concurrency:
      group: pipeline-verify
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          funsecret load "$url"

      - name: Configure local database
        run: |
          db_dir="$HOME/.cache/farfarfun/funflix"
          mkdir -p "$db_dir"
          echo "FUNFLIX_DATABASE_URL=sqlite+aiosqlite:///$db_dir/funflix.db" >> "$GITHUB_ENV"

      - name: Sync pull
        run: funflix sync pull

      # verify 探测第三方网盘链接，受限于显式的限流（worker_verify_rate，约
      # 3.8~5 条/秒，避免触发对方风控），不是数据库延迟——是三个 job 里的
      # 长板。6000 条按实测速率约 26~27 分钟跑完，留出余量控制在 30 分钟内。
      - name: Verify
        run: funflix verify --limit 6000

      - name: Sync push
        if: always()
        run: funflix sync push
