name: Data Pipeline

on:
  schedule:
    # 每 2 小时跑一次，错开整点避免和别的 workflow 抢跑。
    - cron: "13 */2 * * *"
  # 每次提交都跑一遍，代码改动引入的问题当天就能在真实数据上暴露，
  # 不用等到第二天定时任务才发现。
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # collect/parse/verify 各消费自己的队列（采集水位 / 待解析文档 / 待校验资源），
  # 互不依赖对方产出的结果才能跑，所以拆成三个独立 job 并行执行，而不是
  # 一个 job 里顺序跑三步——一步卡住不该拖着后面两步一起等。
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-collect
      # push 触发时取消掉同组里还在跑的旧一轮（多半是上一次 push 触发的），
      # 只让最新代码跑；定时/手动触发不取消任何东西，保证数据采集轮次不丢。
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 数据库地址、采集源凭证等都不进仓库，运行前从远端密钥库拉到本地。
      # secret 里若混入尾随空白（复制粘贴常见），会被解析进库名导致连接失败，先 trim 掉。
      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          funsecret load "$url"

      - name: Collect
        run: funflix collect --limit 10000

  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-parse
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          funsecret load "$url"

      # 单次运行处理量封顶，出问题（比如踩到某种脏数据死循环重试）
      # 影响范围有限，不会一次把所有待解析的都搭进去。
      - name: Parse
        run: funflix parse --limit 20000

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline-verify
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: |
          url="$(printf '%s' "$FUNSECRET_LOAD_URL" | tr -d '[:space:]')"
          funsecret load "$url"

      - name: Verify
        run: funflix verify --limit 10000
