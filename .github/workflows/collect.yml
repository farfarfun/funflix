name: Daily Collect

on:
  schedule:
    # 20:13 UTC ≈ 次日 04:13 北京时间，错开整点避免和别的 workflow 抢跑。
    - cron: "13 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 数据库地址、采集源凭证等都不进仓库，运行前从远端密钥库拉到本地。
      - name: Load secrets
        env:
          FUNSECRET_LOAD_URL: ${{ secrets.FUNSECRET_LOAD_URL }}
        run: funsecret load "$FUNSECRET_LOAD_URL"

      - name: Collect
        run: funflix collect
