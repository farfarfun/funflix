[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funflix"
version = "1.0.32"
description = "影视资源分享文本的结构化采集、解析与网盘链接校验"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["media", "netdisk", "sqlalchemy"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27,<1",

    "typer>=0.12,<0.26",
    "tqdm>=4.66",
    # 交互式菜单：命令/选项的上下箭头选择
    "questionary>=2.0",
    "psycopg2-binary>=2.9.12",


    "asyncpg>=0.29",

    "funsecret>=1.4.96",

    "funworker>=0.1.5",

    "farlog>=1.1.8",

    # 登录 / 角色 / 邀请码注册的全部实现。本仓只在 models 里把它的 mixin 落成
    # 具体表、在 services/account.py 里绑一个实例，bcrypt 也由它带进来。
    "funauth>=0.2.2",
]
license-files = ["LICENSE"]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
llm = ["openai>=1.0"]
# 注意：fundrive 自身声明 requires-python >=3.12，这个 extra 只能在 Python ≥3.12
# 上安装。核心功能（采集/解析/HTTP 匿名探针）不依赖它，装不上不影响使用。
# 目前 src/ 下没有任何模块 import fundrive，它是给 docs/DESIGN.md §6 规划的
# FundriveProbe（匿名探测判不出来时降级到带登录态的网盘驱动）预留的。
drives = ["fundrive>=2.0.85"]
zh = ["opencc-python-reimplemented>=0.1.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    # 只给 tests/test_pipeline_workflow.py 用：把 .github/workflows/*.yml 读进来，
    # 逐条核对流水线里写的命令和选项在 CLI 里真的存在。运行时代码不碰 yaml。
    "pyyaml>=6.0",
]

[project.scripts]
funflix = "funflix.cli:app"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funflix"
Releases = "https://github.com/farfarfun/funflix/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/funflix"]
# 迁移脚本与 alembic.ini 必须进包。它们在仓库根目录、不在 src/funflix 下，
# 不显式收进来的话装完包只有代码没有迁移，`funflix db upgrade` 会直接报
# "No 'script_location' key found"，使用方只能再 clone 一份源码建库。
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "funflix/migrations"
"alembic.ini" = "funflix/alembic.ini"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 src/ 在 sys.path 中优先于 site-packages。
# 若环境里存在旧的实体安装（非 editable），不加这行会静默测到旧代码。
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.funbuild]
latest-packages = ["funworker","funsecret","farlog","funauth"]
