[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "funflix"
version = "0.1.1"
description = "影视资源分享文本的结构化采集、解析与网盘链接校验"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "media", "netdisk", "fastapi", "sqlalchemy",]
classifiers = [ "Programming Language :: Python :: 3.12", "Framework :: FastAPI",]
dependencies = [ "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0.30", "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3", "aiosqlite>=0.20", "httpx>=0.27", "typer>=0.12", "tqdm>=4.66", "psycopg2-binary>=2.9.12", "asyncpg>=0.29", "nltsecret",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
pg = [ "asyncpg>=0.29",]
llm = [ "anthropic>=0.40",]
drives = [ "fundrive>=2.0.85",]
zh = [ "opencc-python-reimplemented>=0.1.7",]
dev = [ "pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6",]

[project.scripts]
funflix = "funflix.cli:app"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funflix"
Releases = "https://github.com/farfarfun/funflix/releases"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
license-files = []

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [ "tests",]
pythonpath = [ "src",]

[tool.hatch.build.targets.wheel]
packages = [ "src/funflix",]
