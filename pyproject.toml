[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funflix"
version = "1.0.5"
description = "影视资源分享文本的结构化采集、解析与网盘链接校验"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["media", "netdisk", "sqlalchemy"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    # cli.py 直接用 click.Parameter/Option/Argument/Command/Group 内省 typer 生成的
    # 命令树做交互式菜单，这些类型要和 typer 内部构建 Command 时用的是同一套。
    # typer>=0.26 起把 click 整份 vendor 进了 typer._click（私有模块，fork 自
    # click 8.3.1），不再依赖外部 click 包——那样 TyperOption/TyperArgument 继承的
    # 是 vendored 版本，跟外部 click 包的类型对不上，isinstance 判断会全部失败。
    # 锁在 vendoring 之前的版本，让 click 继续作为 typer 的真实传递依赖。
    "typer>=0.12,<0.26",
    # 账号密码：登录密码哈希（CLI user 命令与 funflix-api 都用）
    "bcrypt>=4.0",
    "tqdm>=4.66",
    # 交互式菜单：命令/选项的上下箭头选择
    "questionary>=2.0",
    "psycopg2-binary>=2.9.12",
    # 异步驱动。config 会把密钥库里的同步 URL（psycopg2）自动换成 asyncpg，
    # 所以这两个都要在。
    "asyncpg>=0.29",
    # 数据库地址与 LLM 凭证都从这里读
    "funsecret>=1.4.95",
    # parse 命令的并发流水线：生产者/处理单元线程池/消费者
    "funworker>=0.1.1",
    # 统一日志出口，见 §8.1
    "farlog>=1.1.8",
]
license-files = ["LICENSE"]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
llm = ["openai>=1.0"]
# 注意：fundrive 自身声明 requires-python >=3.12，这个 extra 只能在 Python ≥3.12
# 上安装。核心功能（采集/解析/HTTP 匿名探针）不依赖它，装不上不影响使用。
# 目前 src/ 下没有任何模块 import fundrive，它是给 docs/DESIGN.md §6 规划的
# FundriveProbe（匿名探测判不出来时降级到带登录态的网盘驱动）预留的。
drives = ["fundrive>=2.0.85"]
zh = ["opencc-python-reimplemented>=0.1.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
funflix = "funflix.cli:app"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funflix"
Releases = "https://github.com/farfarfun/funflix/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/funflix"]
# 迁移脚本与 alembic.ini 必须进包。它们在仓库根目录、不在 src/funflix 下，
# 不显式收进来的话装完包只有代码没有迁移，`funflix db upgrade` 会直接报
# "No 'script_location' key found"，使用方只能再 clone 一份源码建库。
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "funflix/migrations"
"alembic.ini" = "funflix/alembic.ini"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 src/ 在 sys.path 中优先于 site-packages。
# 若环境里存在旧的实体安装（非 editable），不加这行会静默测到旧代码。
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
