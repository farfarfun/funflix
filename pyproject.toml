[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funflix"
version = "0.1.0"
description = "影视资源分享文本的结构化采集、解析与网盘链接校验"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "farfarfun", email = "farfarfun@qq.com" }]
keywords = ["media", "netdisk", "fastapi", "sqlalchemy"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "tqdm>=4.66",
    "psycopg2-binary>=2.9.12",
    # 异步驱动。config 会把密钥库里的同步 URL（psycopg2）自动换成 asyncpg，
    # 所以这两个都要在。
    "asyncpg>=0.29",
    # 数据库地址与 LLM 凭证都从这里读
    "nltsecret",
]

[project.optional-dependencies]
pg = ["asyncpg>=0.29"]
llm = ["anthropic>=0.40"]
drives = ["fundrive>=2.0.85"]
zh = ["opencc-python-reimplemented>=0.1.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
funflix = "funflix.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/funflix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 src/ 在 sys.path 中优先于 site-packages。
# 若环境里存在旧的实体安装（非 editable），不加这行会静默测到旧代码。
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
