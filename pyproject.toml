[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funflix"
version = "0.1.36"
description = "影视资源分享文本的结构化采集、解析与网盘链接校验"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["media", "netdisk", "fastapi", "sqlalchemy"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "tqdm>=4.66",
    # 交互式菜单：命令/选项的上下箭头选择
    "questionary>=2.0",
    "psycopg2-binary>=2.9.12",
    # 异步驱动。config 会把密钥库里的同步 URL（psycopg2）自动换成 asyncpg，
    # 所以这两个都要在。
    "asyncpg>=0.29",
    # 数据库地址与 LLM 凭证都从这里读
    "funsecret",
    # parse 命令的并发流水线：生产者/处理单元线程池/消费者
    "funworker>=0.1.1",
]
license-files = ["LICENSE"]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
llm = ["anthropic>=0.40"]
drives = ["fundrive>=2.0.85"]
zh = ["opencc-python-reimplemented>=0.1.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
funflix = "funflix.cli:app"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funflix"
Releases = "https://github.com/farfarfun/funflix/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/funflix"]
# 迁移脚本与 alembic.ini 必须进包。它们在仓库根目录、不在 src/funflix 下，
# 不显式收进来的话装完包只有代码没有迁移，`funflix db upgrade` 会直接报
# "No 'script_location' key found"，使用方只能再 clone 一份源码建库。
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "funflix/migrations"
"alembic.ini" = "funflix/alembic.ini"

[tool.setuptools]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 src/ 在 sys.path 中优先于 site-packages。
# 若环境里存在旧的实体安装（非 editable），不加这行会静默测到旧代码。
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
